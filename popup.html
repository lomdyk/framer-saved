<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Framer Saved Components</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0d0d0d;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #0099ff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-primary {
      background: #0099ff;
      border-color: #0099ff;
    }
    .btn-primary:hover {
      background: #0088cc;
      border-color: #0088cc;
    }
    .recent-title {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 12px 0 8px 0;
    }
    .list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 6px 8px;
      text-decoration: none;
      color: #fff;
      transition: background 0.15s ease;
    }
    .item:hover {
      background: #202020;
    }
    .item img {
      width: 36px;
      height: 24px;
      object-fit: cover;
      border-radius: 4px;
      background: #222;
    }
    .item-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }
    .empty {
      text-align: center;
      padding: 16px 0;
      color: #666;
      font-size: 13px;
    }
    .tools {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tools button {
      flex: 1;
      padding: 6px;
      font-size: 11px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #888;
      border-radius: 6px;
      cursor: pointer;
    }
    .tools button:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🔖 Framer Saved</h2>
    <span class="badge" id="count-badge">0</span>
  </div>

  <div class="actions">
    <a href="#" id="open-saved-btn" class="btn btn-primary">Open Saved in Framer</a>
    <button id="import-links-btn" class="btn">+ Import Links</button>
  </div>

  <div class="recent-title">Recent Favorites</div>
  <div class="list" id="saved-list">
    <div class="empty">Loading items...</div>
  </div>

  <div class="tools">
    <button id="export-json">Export JSON</button>
    <button id="clear-all">Clear All</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
